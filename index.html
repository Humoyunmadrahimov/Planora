    <script>
      // Service Worker registration with instant update
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then(function(reg) {
            reg.update();
            console.log('Intizom Service Worker active:', reg.scope);
          }).catch(function(err) {
            console.warn('Service Worker registration:', err);
          });
        });
      }

      // Auto-recovery: if user has a stale/broken cached bundle and #root is empty after 2.5s, clean and reload
      window.addEventListener('load', function() {
        setTimeout(function() {
          var root = document.getElementById('root');
          if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
            console.warn('Empty root detected. Auto-recovering...');
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(k) { caches.delete(k); });
              });
            }
            if (!sessionStorage.getItem('reloaded_auto_fix')) {
              sessionStorage.setItem('reloaded_auto_fix', '1');
              window.location.reload();
            }
          }
        }, 2500);
      });
    </script>
